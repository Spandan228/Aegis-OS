[supervisord]
nodaemon=true
user=root

[program:redis]
command=redis-server
autostart=true
autorestart=true

[program:postgres]
command=su - postgres -c "/usr/lib/postgresql/14/bin/postgres -D /etc/postgresql/14/main -c config_file=/etc/postgresql/14/main/postgresql.conf"
autostart=true
autorestart=true

[program:chromadb]
command=chroma run --path /app/chroma_data --port 8000
autostart=true
autorestart=true
directory=/app

[program:server]
command=python3 -m uvicorn main:app --host 0.0.0.0 --port 8080
directory=/app/apps/server
autostart=true
autorestart=true

[program:simulator]
command=python3 simulator.py
directory=/app/apps/simulator
autostart=true
autorestart=true

[program:web]
command=npm run start -- -p 7860
directory=/app/apps/web
autostart=true
autorestart=true
